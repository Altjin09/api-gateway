server.port=8080

# Lab08: Redis - runs on same droplet as Gateway (localhost)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Cache TTL in seconds
cache.ttl.seconds=60

# Backend services - private VPC IPs (Lab08 VPC)
service.product-order.url=${PRODUCT_ORDER_URL:http://localhost:8082}
service.soap-auth.url=${SOAP_AUTH_URL:http://localhost:8081}
service.file-manager.url=${FILE_MANAGER_URL:http://localhost:8083}

# Logging - for Lab08 deliverable: show cache hit/miss logs
logging.level.com.ecommerce.gateway=DEBUG
